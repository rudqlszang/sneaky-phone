# Unity 커스텀 Gradle 프로퍼티 템플릿
#
# **JVM_HEAP_SIZE** / **STREAMING_ASSETS** / **ADDITIONAL_PROPERTIES** 는
# Unity 가 빌드 시점에 치환하는 자리표시자다. 절대 지우지 말 것.
#
# 여기 추가한 이유:
#  - preferIPv4Stack: 이 네트워크의 DNS 가 dl.google.com 에 대해 AAAA(IPv6) 를 먼저 돌려주는데
#    실제 IPv6 경로가 불안정해 Gradle 이 의존성 해석에 실패했다(aapt2, games-frame-pacing).
#    JVM 이 IPv4 를 우선 쓰게 강제하면 재현되지 않는다.
#  - 타임아웃 연장: 첫 빌드는 Google Maven 에서 수십 MB 를 받아오므로 기본 타임아웃이 짧다.
#  - file.encoding: 프로젝트 경로/문자열에 한글이 있어 UTF-8 을 명시한다.

org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=true

# 네트워크가 느리거나 불안정할 때 첫 빌드가 죽지 않도록 여유를 준다 (밀리초)
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000

unityStreamingAssets=**STREAMING_ASSETS**
**ADDITIONAL_PROPERTIES**
